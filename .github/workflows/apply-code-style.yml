name: CPU source style and documentation layout checks
on:
  push:
    branches: [feature/implement_basics]
    paths: [.clang-format, scripts/apply_code_style.py, .github/workflows/apply-code-style.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libcmocka-dev
          python -m pip install clang-format==22.1.0
      - name: Check canonical Markdown layout
        run: python scripts/check_docs_layout.py
      # No automatic legacy text migrations or source-write commits.
      # No CUDA compiler, hardware probes or GPU execution.
      - name: Validate CPU Debug Release and sanitizers
        run: |
          for mode in Debug Release; do
            cmake -S . -B build-$mode -DCFWX_USE_VCPKG=OFF -DCFWX_CUDA=OFF -DCMAKE_BUILD_TYPE=$mode
            cmake --build build-$mode --parallel 2
            ctest --test-dir build-$mode --output-on-failure
          done
          cmake -S . -B build-asan -DCFWX_USE_VCPKG=OFF -DCFWX_CUDA=OFF -DCFWX_SANITIZERS=ON
          cmake --build build-asan --parallel 2
          ctest --test-dir build-asan --output-on-failure
