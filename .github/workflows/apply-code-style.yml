name: Apply documented C code style
on:
  push:
    branches: [feature/implement_basics]
    paths: [scripts/apply_code_style.py, .clang-format, .github/workflows/apply-code-style.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/implement_basics
      - name: Install dependencies
        run: |
          python -m pip install clang-format==22.1.0
          sudo apt-get update
          sudo apt-get install -y libcmocka-dev
      - name: Apply and verify style
        run: |
          python scripts/apply_code_style.py
          git diff > /tmp/first.diff
          python scripts/apply_code_style.py
          git diff > /tmp/second.diff
          cmp /tmp/first.diff /tmp/second.diff
      - name: Build and test
        run: |
          cmake -S . -B build -DCFWX_USE_VCPKG=OFF
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Commit formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include src test CMakeLists.txt README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Apply Allman formatting and explanatory comments across C sources and headers'
            git push origin HEAD:feature/implement_basics
          fi
