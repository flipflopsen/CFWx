name: Runtime options source integration and CPU validation
on:
  push:
    branches: [feature/implement_basics]
    paths: [scripts/fuse_cuda.py, scripts/extend_runtime.py, scripts/finish_runtime_options.py, scripts/fix_options_maintenance.py, .github/workflows/runtime-options.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/implement_basics
      - run: |
          python -m pip install clang-format==22.1.0
          sudo apt-get update
          sudo apt-get install -y libcmocka-dev
      - name: Static CUDA edits and CPU source changes
        run: |
          python scripts/fix_options_maintenance.py
          python scripts/fuse_cuda.py
          python scripts/extend_runtime.py
          python scripts/finish_runtime_options.py
          git diff > /tmp/first
          python scripts/fuse_cuda.py
          python scripts/extend_runtime.py
          python scripts/finish_runtime_options.py
          git diff > /tmp/second
          cmp /tmp/first /tmp/second
      # CUDA stays OFF. NO nvcc, CUDA discovery, GPU probes or GPU execution.
      - name: CPU-only validation
        run: |
          for mode in Debug Release; do
            cmake -S . -B build-$mode -DCFWX_USE_VCPKG=OFF -DCFWX_CUDA=OFF -DCMAKE_BUILD_TYPE=$mode
            cmake --build build-$mode --parallel 2
            ctest --test-dir build-$mode --output-on-failure
          done
          cmake -S . -B build-asan -DCFWX_USE_VCPKG=OFF -DCFWX_CUDA=OFF -DCFWX_SANITIZERS=ON
          cmake --build build-asan --parallel 2
          ctest --test-dir build-asan --output-on-failure
      - name: Commit CPU changes and uncompiled CUDA source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/finish_runtime_options.py include src test CMakeLists.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate sliding cache durable named checkpoints and opt-in fused CUDA batch source'
            git push origin HEAD:feature/implement_basics
          fi
