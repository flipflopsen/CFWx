name: Doxygen HTML documentation and source coverage
on:
  push:
    branches: [feature/implement_basics]
    paths: [docs/**, doxygen_docs/**, scripts/check_doxygen.py, .github/workflows/doxygen.yml]
permissions:
  contents: read
jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install documentation tools only
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
      # Never rewrite source in documentation CI. CUDA is parsed as text only.
      - name: Validate documentation layout and generate reference
        run: |
          python scripts/check_docs_layout.py
          doxygen doxygen_docs/Doxyfile
          python scripts/check_doxygen.py
      - uses: actions/upload-artifact@v4
        with:
          name: cfwx-doxygen-html
          path: doxygen_docs/generated/
