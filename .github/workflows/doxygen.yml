name: Doxygen HTML documentation and source coverage
on:
  push:
    branches: [feature/implement_basics]
    paths: [Doxyfile, docs/doxygen/**, scripts/document_repository.py, scripts/refine_doxygen.py, scripts/finalize_doxygen.py, scripts/polish_doxygen.py, scripts/prepare_doxygen.py, scripts/check_doxygen.py, .github/workflows/doxygen.yml]
permissions:
  contents: write
jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/implement_basics
      - name: Install documentation tools only
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
      - name: Annotate source and generate reference
        run: |
          python scripts/prepare_doxygen.py
          doxygen Doxyfile
          python scripts/check_doxygen.py
      # Doxygen parses CUDA as text. No compiler, toolkit, probes or GPU execution.
      - uses: actions/upload-artifact@v4
        with:
          name: cfwx-doxygen-html
          path: build-docs/
      - name: Commit source comments and additive docs integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include src test scripts cmake docs/doxygen Doxyfile CMakeLists.txt README.md .gitignore
          if ! git diff --cached --quiet; then
            git commit -m 'Document repository APIs definitions owners and guides with Doxygen'
            git push origin HEAD:feature/implement_basics
          fi
